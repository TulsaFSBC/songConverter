# Builds and tests every push and pull request; deploys to Azure when main changes.
# Docs: https://github.com/Azure/functions-action

name: Build and deploy SongConverter

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Create deployment package
        # Only what the Function App needs at run time: compiled code, production
        # dependencies, the ProPresenter .proto files and the host configuration.
        run: |
          mkdir -p deploy
          cp -r dist proto host.json package.json package-lock.json deploy/
          rm -rf deploy/dist/test deploy/dist/scripts
          cd deploy
          npm ci --omit=dev --ignore-scripts

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: deploy
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: deploy

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: 'SongConverter'
          package: deploy
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2310C9DD2A414403B441A1B34BEF35E8 }}
